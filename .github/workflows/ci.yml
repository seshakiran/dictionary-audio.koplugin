name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zip unzip
      - name: Test
        run: |
          lua5.1 dictionary-audio-test.lua
          python3 -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('scripts').glob('*.py')]"
      - name: Verify release package
        shell: bash
        run: |
          ./scripts/package.sh
          unzip -t dist/dictionary-audio.koplugin.zip
          diff -u <(printf '%s\n' \
            dictionary-audio.koplugin/ \
            dictionary-audio.koplugin/LICENSE \
            dictionary-audio.koplugin/_meta.lua \
            dictionary-audio.koplugin/audio_index.lua \
            dictionary-audio.koplugin/audio_player.lua \
            dictionary-audio.koplugin/main.lua \
            dictionary-audio.koplugin/pluginupdater.lua) \
            <(unzip -Z1 dist/dictionary-audio.koplugin.zip | sort)
